services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-taskflow}
      POSTGRES_USER:     ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Go API ───────────────────────────────────────────────────────────────────
  # Migrations run automatically on startup (embedded in the binary).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://taskflow:changeme@db:5432/taskflow?sslmode=disable}
      JWT_SECRET:   ${JWT_SECRET:-insecure-dev-secret-change-me}
      PORT:         ${PORT:-8080}
      CORS_ORIGIN:  ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/users 2>&1 | grep -q 'unauthorized' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Seed (one-shot, loads test data) ─────────────────────────────────────────
  seed:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./backend/seed.sql:/seed.sql:ro
    command: >
      psql -h db -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow} -f /seed.sql

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
